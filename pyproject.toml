[project]
name = "takler-test-suite"
version = "0.1.0"
description = "End-to-end scenario tests and operator exercises for Takler"
requires-python = ">=3.11"

[dependency-groups]
scenarios = [
    "takler[http,tui]",
    "grpcio>=1.80",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "textual>=0.60",
]
test = [
    { include-group = "scenarios" },
    "pytest>=8.0",
    "ruff>=0.15",
]
workflow = [
    { include-group = "scenarios" },
    "takflow",
]
docs = [
    "sphinx>=8.1",
    "pydata-sphinx-theme>=0.16",
    "myst-parser>=5.2",
]

[tool.uv]
package = false
default-groups = []

[tool.uv.sources]
takler = { git = "https://github.com/cemc-oper/takler.git", rev = "80ffe716223a035d7ba52cd3342238a40789cc19" }
takflow = { git = "https://github.com/cemc-oper/takflow.git", rev = "1e108ecdfa9e7d2627a43f574585318b8f71cf46" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
